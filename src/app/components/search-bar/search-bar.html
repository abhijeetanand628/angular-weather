<div class="flex justify-center w-full px-4 pt-10">
  <form
    class="relative w-full max-w-[480px]"
    (submit)="$event.preventDefault(); searchCity(cityInput.value, cityInput)"
  >
    <input
      #cityInput
      class="h-[65px] w-full p-6 bg-[#9999FF] rounded-full
             text-white font-semibold border-none shadow-xl
             placeholder-white text-lg outline-gray-400"
      type="text"
      placeholder="Enter city name"
    />

    <button
      type="submit"
      aria-label="Search city"
      class="absolute right-5 top-1/2 -translate-y-1/2
             text-white cursor-pointer"
    >
      <svg lucideSearch [size]="25"></svg>
    </button>
  </form>
</div>
